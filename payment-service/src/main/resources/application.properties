spring.application.name=payment-service
app.instance-id=8081
#DATASOURCE
spring.datasource.url=jdbc:postgresql://localhost:5432/nexupay
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

#logging.level.com.zaxxer.hikari=DEBUG
#FOR MATRIX AND HEALTH
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.access=unrestricted
management.endpoint.metrics.access=unrestricted
management.endpoint.prometheus.access=unrestricted

# Enable HTTP request duration histogram
management.metrics.distribution.percentiles-histogram.http.server.requests=true

#Hikari connection pool
spring.datasource.hikari.maximum-pool-size=20

# REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379

# REDIS TIMEOUT
spring.data.redis.connect-timeout=60s
spring.data.redis.timeout=60s

#CACHE KEY
nexupay.security.cache-key=this-is-my-cache-key-for-authentication
#FOR REDIS CACHES TTL
nexupay.security.auth-cache-ttl=10m

#RATE LIMIT PROPERTIES
nexupay.rate-limit.capacity=300
nexupay.rate-limit.refill-rate=100